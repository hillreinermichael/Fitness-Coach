<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1769aa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fitness Coach">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/icon-32.png">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<meta name="theme-color" content="#202124">
<title>Fitness Training</title>
<style>
*{box-sizing:border-box}
:root{--blue-dark:#123b63;--blue:#1976b9;--blue-soft:#eaf4fb;--blue-border:#b9d4e8;--surface:#fff;--text:#18232d;--muted:#6a7a88;--line:#d7e2eb}
body{margin:0;font-family:Arial,sans-serif;color:var(--text);background:#eaf1f6}
header{background:linear-gradient(135deg,var(--blue-dark),var(--blue));color:#fff;padding:13px 14px;box-shadow:0 3px 10px #001b2d2e;position:sticky;top:0;z-index:5}
.header-brand{display:grid;grid-template-columns:45px 1fr 45px;align-items:center;gap:10px;max-width:700px;margin:auto}
.header-logo{width:45px;height:45px;border-radius:11px;box-shadow:0 1px 5px #0004}
.header-center{text-align:center;min-width:0}
.header-center h1{font-size:20px;letter-spacing:.3px;margin:0 0 2px;font-weight:800;white-space:nowrap}
.header-center small{opacity:.9}
main{max-width:700px;margin:auto;padding:11px 10px 32px}
button{font-family:inherit;border-radius:10px;cursor:pointer;font-weight:800}
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:2px}
.home-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px;min-height:118px;text-align:left;color:var(--text);box-shadow:0 3px 9px #0d29400f}
.home-card:first-child{grid-column:span 2;min-height:100px}
.home-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--blue-soft);color:var(--blue);font-size:21px;margin-bottom:9px}
.home-title{font-size:17px;color:var(--blue-dark);font-weight:900}.home-text{font-size:12px;line-height:1.35;color:var(--muted);margin-top:4px}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:9px 0 10px}.nav button{padding:10px 12px;background:#fff;color:var(--blue-dark);border:2px solid var(--blue-border);box-shadow:0 2px 6px #0d29400c}.nav button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.back{padding:8px 11px;background:#fff;color:var(--blue-dark);border:1px solid var(--blue-border);font-size:13px;margin-bottom:3px}
.sectiontitle{font-size:18px;font-weight:900;color:var(--blue-dark);margin:5px 0 7px}.settings-note{background:var(--blue-soft);border:1px solid var(--blue-border);color:#466171;border-radius:10px;padding:9px 10px;font-size:12px;margin-bottom:8px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 10px;margin:6px 0;box-shadow:0 2px 7px #0d29400d}.card.done{background:#f4fbff;border-color:#a8c9df}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.exercise{font-size:15px;font-weight:900;color:var(--blue-dark);line-height:1.2;white-space:nowrap}.exercise-target{font-size:12px;font-weight:700;color:var(--muted);margin-left:3px}
.check{flex:0 0 31px;width:31px;height:31px;border-radius:50%;border:1px solid var(--blue-border);background:#edf3f7;color:var(--blue-dark);padding:0;font-size:17px}.check.on{background:var(--blue);border-color:var(--blue);color:#fff}
.set-row{display:flex;align-items:center;gap:6px;margin-top:5px}.set-info{flex:1;min-width:0}.progress{font-size:11px;margin:0 0 3px;color:#4e6474;font-weight:800}.bar{height:5px;background:#e7eef4;border-radius:10px;overflow:hidden}.fill{height:100%;background:var(--blue);border-radius:10px}
.setbtn{width:30px;min-width:30px;height:30px;flex:0 0 30px;padding:0;background:var(--blue);color:#fff;font-size:20px;line-height:1;border:1px solid var(--blue)}
.reset-one{width:30px;min-width:30px;height:30px;background:#f2f6f9;color:#667784;border:1px solid var(--line);padding:0;font-size:17px;line-height:1}
.reset-all{width:100%;padding:8px 10px;margin:0 0 8px;background:#fff;color:var(--blue-dark);border:1px solid var(--blue-border);font-size:12px}
.setting-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin:6px 0;box-shadow:0 2px 7px #0d29400b}.setting-name{font-size:15px;font-weight:900;color:var(--blue-dark);margin-bottom:7px}
.inputs{display:grid;grid-template-columns:1fr 1fr;gap:7px}label{font-size:11px;color:var(--muted);font-weight:800}
input{width:100%;font-size:16px;padding:8px;border:1px solid #c6d5df;border-radius:8px;margin-top:3px;background:#fcfdfe}.save-setting{margin-top:7px;background:var(--blue);color:#fff;width:100%;padding:8px;font-size:13px}
.hidden{display:none}.danger{background:#fff1f1;color:#a00;border:1px solid #eccaca;padding:9px 11px;font-size:13px}.history div{padding:6px 0;font-size:12px}.history hr{border:0;border-top:1px solid #e5ebf0}
@media(max-width:460px){main{padding-left:8px;padding-right:8px}.home-card{padding:13px}.exercise{font-size:14px}.exercise-target{font-size:11px}}
</style>
</head>
<body>
<header>
  <div class="header-brand">
    <img src="./icons/icon-96.png" class="header-logo" alt="">
    <div class="header-center">
      <h1>FITNESS COACH V14</h1>
      <small id="subtitle">Startseite</small>
    </div>
    <img src="./icons/icon-96.png" class="header-logo" alt="">
  </div>
</header>

<main>
  <section id="home">
    <div class="home-grid">
      <button class="home-card" onclick="openView('checklist')">
        <div class="home-icon">✓</div>
        <div class="home-title">TRAINING</div>
        <div class="home-text">Plan auswählen und Übungen abhaken</div>
      </button>
      <button class="home-card" onclick="openView('settings')">
        <div class="home-icon">⚙</div>
        <div class="home-title">EINSTELLUNGEN</div>
        <div class="home-text">Gewicht, Wert und Wiederholungen festlegen</div>
      </button>
      <button class="home-card" onclick="openView('history')">
        <div class="home-icon">↗</div>
        <div class="home-title">VERLAUF</div>
        <div class="home-text">Vergangene Trainings und Leistungen</div>
      </button>
    </div>
  </section>

  <section id="checklist" class="view hidden">
    <button class="back" onclick="openView('home')">← Startseite</button>
    <div class="nav">
      <button id="planA" class="active" onclick="showPlan('A')">PLAN 1A</button>
      <button id="planB" onclick="showPlan('B')">PLAN 1B</button>
    </div>
    <button class="reset-all" onclick="resetPlan()">↻ NEUES TRAINING – CHECKLISTE ZURÜCKSETZEN</button>
    <div id="training"></div>
  </section>

  <section id="settings" class="view hidden">
    <button class="back" onclick="openView('home')">← Startseite</button>
    <div class="sectiontitle">Gewicht / Wert & Wiederholungen</div>
    <div class="settings-note">Hier werden die Vorgabewerte geändert. Die Checkliste bleibt dadurch übersichtlich.</div>
    <div class="nav">
      <button id="settingsA" class="active" onclick="showSettings('A')">PLAN 1A</button>
      <button id="settingsB" onclick="showSettings('B')">PLAN 1B</button>
    </div>
    <div id="settingsContent"></div>
  </section>

  <section id="history" class="view hidden">
    <button class="back" onclick="openView('home')">← Startseite</button>
    <div class="sectiontitle">Trainingsverlauf</div>
    <div id="historyContent" class="card history"></div>
    <button class="danger" onclick="clearHistory()">Verlauf löschen</button>
  </section>
</main>
<script>
const plans={
A:[
["Fahrrad",21,"Min.",1,1],["Hammer-Curl",10,"kg",12,4],["Dips",1,"",12,4],["Scottcurl",60,"kg",8,4],
["Trizeps",35,"kg",8,4],["Schulter",50,"kg",10,4],["Seitheben",22.5,"kg",8,4],["Reverse Butterfly",55,"kg",8,4],
["Beinpresse",144,"kg","8–12",4],["Beinstrecker",80,"kg",8,4],["Beinbeuger",70,"kg",8,4],
["Gluteus","MAX","",12,4],["Waden",60,"kg",8,4],["Bizeps sitzend",7,"kg",10,4],["Ausdauer",21,"Min.",1,1]
],
B:[
["Fahrrad",21,"Min.",1,1],["Lat-Zug",50,"kg","8–12",4],["Ruder Zug",45,"kg","8–12",4],["Bankdrücken",50,"kg",8,4],
["Butterfly",35,"kg",8,4],["Adduktoren",118,"kg","8–12",4],["Adduktoren",118,"kg","8–12",4],
["Kreuzheben",50,"kg",8,4],["Situps",20,"",20,4],["Gluteus","MAX","",12,4],["Bauch",70,"kg",8,4],["Ausdauer",21,"Min.",1,1]
]};
let current="A", settingsPlan="A";
let state=JSON.parse(localStorage.getItem("fitnessState")||"{}");
let settings=JSON.parse(localStorage.getItem("fitnessSettings")||"{}");
let history=JSON.parse(localStorage.getItem("fitnessHistory")||"[]");
function key(p,i){return p+"_"+i}
function save(){localStorage.setItem("fitnessState",JSON.stringify(state));localStorage.setItem("fitnessSettings",JSON.stringify(settings));localStorage.setItem("fitnessHistory",JSON.stringify(history))}
function openView(v){
 document.querySelectorAll(".view").forEach(x=>x.classList.add("hidden"));
 document.getElementById("home").classList.toggle("hidden",v!=="home");
 if(v!=="home")document.getElementById(v).classList.remove("hidden");
 document.getElementById("subtitle").textContent=v==="home"?"Startseite":v==="checklist"?"Training":v==="settings"?"Einstellungen":"Verlauf";
 if(v==="checklist")render(); if(v==="settings")renderSettings(); if(v==="history")renderHistory();
}
function showPlan(p){current=p;document.getElementById("planA").classList.toggle("active",p==="A");document.getElementById("planB").classList.toggle("active",p==="B");render()}
function render(){
 const el=document.getElementById("training");el.innerHTML="";
 plans[current].forEach((ex,i)=>{
  const [name,defW,unit,reps,total]=ex,k=key(current,i);
  const cfg=settings[k]||{w:defW,r:reps},s=state[k]||{sets:0,done:false};
  const div=document.createElement("div");div.className="card"+(s.done?" done":"");
  div.innerHTML=`<div class="row"><div><div class="exercise">${name} <span class="exercise-target">(${cfg.w}${unit?" "+unit:""} · ${cfg.r}${unit==="Min."?" Min.":" Wdh."})</span></div></div>
  <button class="check ${s.done?"on":""}" onclick="toggleDone(${i})">${s.done?"✓":"○"}</button></div>
  <div class="set-row">
    <div class="set-info">
      <div class="progress">${s.sets}/${total} ${total===1?"Satz":"Sätze"}</div>
      <div class="bar"><div class="fill" style="width:${Math.min(s.sets,total)*(100/total)}%"></div></div>
    </div>
    <button class="setbtn" onclick="addSet(${i})">${s.sets<total?"+":"✓"}</button>
    <button class="reset-one" onclick="resetExercise(${i})">↻</button>
  </div>`;
  el.appendChild(div);
 });
}
function addSet(i){
 const ex=plans[current][i],k=key(current,i),total=ex[4],cfg=settings[k]||{w:ex[1],r:ex[3]};
 const s=state[k]||{sets:0,done:false};
 if(s.sets<total){
   s.sets++;
   if(s.sets===total){
     s.done=true;
     history.unshift({date:new Date().toLocaleString("de-DE"),plan:"1"+current,exercise:ex[0],weight:cfg.w,reps:cfg.r});
   }
 }
 state[k]=s;save();render();
}
function resetExercise(i){
 delete state[key(current,i)];
 save();render();
}
function resetPlan(){
 if(!confirm("Alle Übungen von Plan 1"+current+" für ein neues Training zurücksetzen?\nGewichte und Wiederholungen bleiben erhalten.")) return;
 plans[current].forEach((ex,i)=>delete state[key(current,i)]);
 save();render();
}
function toggleDone(i){
 const ex=plans[current][i],k=key(current,i),s=state[k]||{sets:0,done:false};
 s.done=!s.done;if(s.done)s.sets=ex[4];state[k]=s;save();render();
}
function showSettings(p){
 settingsPlan=p;document.getElementById("settingsA").classList.toggle("active",p==="A");document.getElementById("settingsB").classList.toggle("active",p==="B");renderSettings();
}
function renderSettings(){
 const el=document.getElementById("settingsContent");el.innerHTML="";
 plans[settingsPlan].forEach((ex,i)=>{
  const k=key(settingsPlan,i),cfg=settings[k]||{w:ex[1],r:ex[3]},div=document.createElement("div");
  div.className="setting-card";
  div.innerHTML=`<div class="setting-name">${ex[0]}</div><div class="inputs">
  <div><label>Gewicht / Wert${ex[2]?" ("+ex[2]+")":""}</label><input id="sw${i}" value="${cfg.w}" inputmode="decimal"></div>
  <div><label>${ex[2]==="Min."?"Zeit":"Wiederholungen"}</label><input id="sr${i}" value="${cfg.r}" inputmode="decimal"></div></div>
  <button class="save-setting" onclick="saveSetting(${i})">SPEICHERN</button>`;
  el.appendChild(div);
 });
}
function saveSetting(i){
 const ex=plans[settingsPlan][i];settings[key(settingsPlan,i)]={w:document.getElementById("sw"+i).value,r:document.getElementById("sr"+i).value};save();renderSettings();
}
function renderHistory(){
 const el=document.getElementById("historyContent");
 if(!history.length){el.innerHTML='<span class="muted">Noch kein abgeschlossener Satzblock.</span>';return}
 el.innerHTML=history.slice(0,150).map(x=>`<div><b>${x.date}</b> · Plan ${x.plan}<br>${x.exercise}: ${x.weight}${x.weight?" × ":""}${x.reps}</div><hr>`).join("");
}
function clearHistory(){if(confirm("Verlauf wirklich löschen?")){history=[];save();renderHistory()}}
openView("home");
if("serviceWorker" in navigator){
  window.addEventListener("load", async ()=>{
    try{
      await navigator.serviceWorker.register("./sw.js?V11");
    }catch(e){}
  });
}
</script>
</body>
</html>
